name: Build Kula APP for Windows

on:
  push:
    branches: [main]
    paths:
      - 'kula-app/**'
      - 'extension/**'
      - 'chatgpt-extension/**'
      - 'tests/*extension*.test.mjs'
      - 'tests/application-runner.browser.test.mjs'
      - 'docs/automation.md'
      - '.github/workflows/kula-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test extension command handling
        run: node --test tests/runner-extension.test.mjs tests/application-runner.browser.test.mjs tests/chatgpt-extension.test.mjs
      - name: Test the app
        run: python -m unittest discover -s kula-app/tests -p "test_*.py" -v
      - name: Test the Windows UI
        run: python kula-app/kula_app.py --smoke-test
      - name: Build Windows executable
        shell: pwsh
        run: ./kula-app/publish-windows.ps1
      - name: Smoke-test the packaged executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'kula-app/artifacts/win-x64/KulaAPP.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'The packaged app did not finish its smoke test.'
          }
          if ($process.ExitCode -ne 0) { throw "Packaged app smoke test failed: $($process.ExitCode)" }
      - name: Assemble app and extension
        shell: pwsh
        run: |
          $package = 'kula-app/artifacts/KulaAPP-package'
          New-Item -ItemType Directory -Path "$package/extension", "$package/chatgpt-extension" -Force | Out-Null
          Copy-Item 'kula-app/artifacts/win-x64/KulaAPP.exe' "$package/KulaAPP.exe"
          Copy-Item 'extension/*' "$package/extension/"
          Copy-Item 'chatgpt-extension/*' "$package/chatgpt-extension/"
          Copy-Item 'kula-app/README.md' "$package/README.md"
          Copy-Item 'docs/automation.md' "$package/AUTOMATION.md"
          $hash = (Get-FileHash "$package/KulaAPP.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  KulaAPP.exe" | Set-Content "$package/SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: KulaAPP-windows-x64
          path: kula-app/artifacts/KulaAPP-package/
          if-no-files-found: error
          retention-days: 30
